services:
  sam-website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sam-segmentation-app-gpu
    # Use host networking so Cloudflare/origin can reach the Flask server on localhost:5013.
    # (Docker port publishing to the host appears to accept TCP but fails to deliver HTTP bytes.)
    network_mode: host
    volumes:
      # Mount directories for persistence
      - ./src:/app/src
      - ./uploads:/app/uploads
      - ./results:/app/results
      - ./templates:/app/templates
      - ./model:/app/model
      - ./data:/app/data:ro
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      # Use GPU 0 from host (NVIDIA RTX 5000 Ada, higher VRAM)
      # NVIDIA_VISIBLE_DEVICES=0 exposes only GPU 0 to container
      # CUDA_VISIBLE_DEVICES=0 uses the first (and only) GPU inside container (host GPU 0)
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    # GPU configuration - use nvidia runtime
    runtime: nvidia
    restart: unless-stopped
